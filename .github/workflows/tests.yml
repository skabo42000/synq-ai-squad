# Runs the unit tests on GitHub's computers after every push and pull request.
# No API keys needed: the tests never call an AI model.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # this action only publishes exact version tags
      - run: uv sync --frozen
      - run: uv run pytest -v
