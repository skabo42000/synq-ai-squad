  # ---------- unsupported: stretched facts (BORDERLINE) ----------
  - claim: The service pays for itself in the hours saved each week.
    supported: false
    note: BORDERLINE. The documents say many owners find it "pays for itself in time saved"; "each week" adds detail.
  - claim: Security is a top priority for Synq Logic.
    supported: false
    note: BORDERLINE. The FAQ only says we connect only the tools needed and explain how information is handled.
  - claim: You don't need to hire more staff to handle bottlenecks.
    supported: false
    note: BORDERLINE. Not stated; the documents say automation takes repetitive tasks off the team's plate.
  - claim: Synq Logic helps restaurant teams keep tables organized.
    supported: false
    note: BORDERLINE. Restaurants are a listed industry, but table management is never mentioned.
  - claim: Automation means faster turnaround on paperwork and legal filings.
    supported: false
    note: BORDERLINE. "Much faster turnaround" is stated for paperwork; "legal filings" is not.
