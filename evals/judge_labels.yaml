    supported: false
  - claim: Synq Logic has been in business for more than ten years.
    supported: false
  - claim: Synq Logic's assistants speak more than 30 languages.
    supported: false
  - claim: Setup takes less than 48 hours.
    supported: false
  - claim: Synq Logic is HIPAA certified.
    supported: false
  - claim: Every client sees results in their first month.
    supported: false
