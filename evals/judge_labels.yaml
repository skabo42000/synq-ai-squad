# Human labels for calibrating the eval judge ("who evaluates the evaluator?").
# Each claim is labelled against the knowledge base in knowledge/: supported = the documents back it up.
# `evals.py --calibrate-judge` sends each claim to the judge and reports precision / recall vs these labels.
#
# Drafted by Claude from the documents, then reviewed by Bosko. BORDERLINE items are the ones a reasonable
# person could label either way; several are real claims the judge flagged in earlier eval runs.
version: 1
status: draft (awaiting Bosko's review)

labels:
  # ---------- supported: faithful rewording of the documents ----------
  - claim: Synq Logic's assistants answer questions on your website, by text, and by phone.
    supported: true
  - claim: Our assistants can qualify leads and book appointments for you.
    supported: true
  - claim: The assistant hands the conversation to a real person whenever that's the better choice.
    supported: true
  - claim: Most businesses start with one focused project that goes live in weeks, not months.
    supported: true
  - claim: You don't need to be technical to use what Synq Logic builds.
    supported: true
  - claim: Synq Logic connects the email, calendars, booking and invoicing tools you already use.
    supported: true
  - claim: New leads land in your customer list automatically.
    supported: true
  - claim: Working with Synq Logic starts with a free strategy call.
    supported: true
  - claim: Automation won't replace your team; it takes the repetitive tasks off their plate.
    supported: true
  - claim: Reminders go out automatically, so appointment slots stay full.
    supported: true
  - claim: Customers can pick a time slot and it goes straight onto your calendar.
    supported: true
  - claim: Your weekly numbers can land in your inbox automatically.
    supported: true
  - claim: Synq Logic helps business owners win back 10+ hours a week.
    supported: true
  - claim: The cost depends on what you want automated.
    supported: true
  - claim: Happy customers are asked for a review right after the job.
    supported: true
  - claim: Automating data entry means fewer mistakes and much faster turnaround.
    supported: true
  - claim: Synq Logic makes your business feel more professional to every customer.
    supported: true
    note: from use-cases.md; the judge flagged this in the Oct 5 baseline (a real false alarm)

