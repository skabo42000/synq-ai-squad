[project]
name = "synq-ai-squad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
synq-ai-squad = "synq_ai_squad:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Project lives in OneDrive: copy files instead of hard-linking from the uv cache
link-mode = "copy"
